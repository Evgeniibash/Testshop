name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install selenium pytest allure-pytest webdriver-manager psycopg2-binary pytest-assume

      - name: Start Docker
        run: |
          docker compose up -d --build
          sleep 10

      - name: Reset and init database
        run: |
          docker compose exec -T db psql -U shop -d shop -c "TRUNCATE cart_items, orders, carts, users, products, categories RESTART IDENTITY CASCADE;"
          docker compose exec -T db psql -U shop -d shop -f db/init.sql

      - name: Run API tests
        run: |
          pytest tests/test_api.py -v --maxfail=5

      - name: Install Allure
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.30.0/allure-2.30.0.tgz
          tar -xzf allure-2.30.0.tgz
          sudo mv allure-2.30.0 /opt/allure
          echo 'export PATH=$PATH:/opt/allure/bin' >> $GITHUB_PATH

      - name: Generate Allure Report
        run: |
          allure generate allure-results --clean -o allure-report

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: ./allure-report